[project]
name = "dey-alert-backend"
version = "0.1.0"
description = "Dey Alert API, worker, and admin panel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "arq>=0.26",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "firebase-admin>=6.6",
    "geoalchemy2>=0.16",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "pyjwt[crypto]>=2.10",
    "redis>=5.2",
    "sentry-sdk>=2.18",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F811"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
