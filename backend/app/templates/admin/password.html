<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dey Alert Admin</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A0C0A;color:#F2F5F3;font:15px/1.5 Inter,system-ui,sans-serif}
form{width:360px;background:#141714;border:1px solid #3A413A;border-radius:20px;padding:24px}
h1{margin:0 0 4px;font-size:24px}p{color:#B4BCB4;margin:0 0 16px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #3A413A;background:#0A0C0A;color:#F2F5F3;box-sizing:border-box;font-size:15px}
button{width:100%;margin-top:18px;min-height:48px;border:0;border-radius:999px;background:#A6EF1F;color:#0A0C0A;font-weight:700;font-size:15px;cursor:pointer}
.err{color:#FF3B30}.qr{display:block;width:200px;height:200px;margin:0 auto 12px;background:#fff;border-radius:12px;padding:8px}code{display:block;word-break:break-all;background:#0A0C0A;border:1px solid #3A413A;border-radius:12px;padding:10px;margin-bottom:12px;font-size:13px}</style></head>
<body><form method="post"><h1>Choose a new password</h1><p>The password you were given only works once. Use at least 12 characters.</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<input name="new_password" type="password" placeholder="New password" autocomplete="new-password" minlength="12" required autofocus>
<input name="confirm_password" type="password" placeholder="Repeat new password" autocomplete="new-password" minlength="12" required style="margin-top:12px">
<button>Save password</button></form></body></html>
