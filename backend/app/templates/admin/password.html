{% extends "_auth_base.html" %}
{% block title %}Choose a password{% endblock %}
{% block card %}
<form method="post" action="/admin/password">
<h2>Choose a new password</h2>
<p class="lead">The password you were given only works once. Use at least 12 characters you don't use anywhere else.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<label for="new_password">New password</label>
<div class="field"><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required autofocus><button type="button" class="toggle" data-reveal="new_password">Show</button></div>
<label for="confirm_password">Repeat new password</label>
<input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
<button class="primary">Save password</button>
</form>
{% endblock %}
