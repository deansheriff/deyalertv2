<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dey Alert Admin</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A0C0A;color:#F2F5F3;font:15px/1.5 Inter,system-ui,sans-serif}
form{width:360px;background:#141714;border:1px solid #3A413A;border-radius:20px;padding:24px}
h1{margin:0 0 4px;font-size:24px}p{color:#B4BCB4;margin:0 0 16px}
label{display:block;margin:12px 0 4px;color:#B4BCB4}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #3A413A;background:#0A0C0A;color:#F2F5F3;box-sizing:border-box}
button{width:100%;margin-top:18px;min-height:48px;border:0;border-radius:999px;background:#A6EF1F;color:#0A0C0A;font-weight:700;font-size:15px;cursor:pointer}
.err{color:#FF3B30}.ok{color:#A6EF1F}</style></head>
<body><form method="post"><h1>Dey Alert</h1><p>Moderators and admins only.</p>
{% if notice %}<p class="ok">{{ notice }}</p>{% endif %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<label for="email">Email</label><input id="email" name="email" type="email" required autofocus>
<label for="password">Password</label><input id="password" name="password" type="password" required>
<button>Continue</button></form></body></html>
