<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign in{% endblock %} · Dey Alert Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0C0A;--card:#141714;--line:#2A302A;--line2:#3A413A;--text:#F2F5F3;--muted:#B4BCB4;--faint:#7D867D;--lime:#A6EF1F;--ink:#0A0C0A;--red:#FF3B30;--green:#3DD68C}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:1.2fr 1fr;min-height:100vh}
.brand{position:relative;overflow:hidden;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);
  background:radial-gradient(1200px 600px at 20% 110%,rgba(166,239,31,.10),transparent 60%),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/44px 44px,#0B0E0B}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.mark{width:42px;height:42px;border-radius:13px;background:var(--lime);display:grid;place-items:center;color:var(--ink);box-shadow:0 0 36px rgba(166,239,31,.35)}
.hero h1{font-size:46px;line-height:1.05;letter-spacing:-.035em;margin:0 0 16px;max-width:520px}
.hero h1 span{color:var(--lime)}
.hero p{color:var(--muted);font-size:17px;max-width:460px;margin:0}
.pulse{position:absolute;border-radius:50%;filter:blur(.3px)}
.pulse:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid currentColor;opacity:.35;animation:ring 2.8s ease-out infinite}
@keyframes ring{from{transform:scale(.4);opacity:.55}to{transform:scale(1.6);opacity:0}}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{padding:14px 18px;border-radius:18px;background:rgba(20,23,20,.7);border:1px solid var(--line2);backdrop-filter:blur(10px);min-width:150px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.panel{display:grid;place-items:center;padding:40px 24px}
.card{width:100%;max-width:410px}
.card h2{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
.card .lead{color:var(--muted);margin:0 0 26px}
label{display:block;margin:16px 0 7px;color:var(--muted);font-size:13px;font-weight:500}
.field{position:relative}
input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line2);background:#0F120F;color:var(--text);font:15px Inter,system-ui,sans-serif;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(166,239,31,.12)}
.toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font:600 12px Inter,sans-serif;padding:6px}
button.primary{width:100%;margin-top:24px;height:50px;border:0;border-radius:999px;background:var(--lime);color:var(--ink);font:700 15px Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 0 32px rgba(166,239,31,.28);transition:transform .1s,background .15s}
button.primary:hover{background:#B8F743}
button.primary:active{transform:scale(.99)}
.err,.ok{padding:12px 14px;border-radius:14px;font-size:14px;margin-bottom:6px}
.err{background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.35);color:#FF6B61}
.ok{background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.35);color:var(--green)}
.help{color:var(--faint);font-size:13px;margin-top:18px;text-align:center}
.foot{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--faint);font-size:12.5px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.code-input{font-size:26px;letter-spacing:12px;text-align:center;font-variant-numeric:tabular-nums}
.qr{display:block;width:200px;height:200px;margin:4px auto 14px;background:#fff;border-radius:16px;padding:10px}
.secret{display:block;font-family:ui-monospace,monospace;font-size:13px;background:#0F120F;border:1px solid var(--line2);border-radius:12px;padding:10px;word-break:break-all;color:var(--muted)}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.brand{display:none}}
</style>
</head>
<body>
<div class="wrap">
<section class="brand">
<div class="logo"><span class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><path d="M12 6.5v3.5M12 13h.01"/></svg></span>Dey Alert</div>
<span class="pulse" style="left:62%;top:28%;width:12px;height:12px;background:#FF3B30;color:#FF3B30"></span>
<span class="pulse" style="left:78%;top:46%;width:10px;height:10px;background:#F2711C;color:#F2711C"></span>
<span class="pulse" style="left:54%;top:58%;width:9px;height:9px;background:#F5A623;color:#F5A623"></span>
<span class="pulse" style="left:70%;top:68%;width:9px;height:9px;background:#5B9BD5;color:#5B9BD5"></span>
<div class="hero">
<h1>Community safety, <span>coordinated.</span></h1>
<p>Moderators, verifiers and partners keep Nigerian communities informed in real time.</p>
</div>
{% block stats %}{% endblock %}
</section>
<section class="panel"><div class="card">{% block card %}{% endblock %}</div></section>
</div>
<script>
document.querySelectorAll("[data-reveal]").forEach(btn => btn.addEventListener("click", () => {
  const input = document.getElementById(btn.dataset.reveal);
  input.type = input.type === "password" ? "text" : "password";
  btn.textContent = input.type === "password" ? "Show" : "Hide";
}));
</script>
</body>
</html>
