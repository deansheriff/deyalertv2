<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
{% block head %}{% endblock %}
<title>Dey Alert</title>
<style>
:root{--bg:#0A0C0A;--card:#141714;--line:#3A413A;--text:#F2F5F3;--muted:#B4BCB4;--lime:#A6EF1F;--ink:#0A0C0A;--red:#FF3B30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:420px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:24px;line-height:1.25;margin:0 0 8px;letter-spacing:-.02em}
p{margin:0 0 12px;color:var(--muted)}
.brand{font-weight:700;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;min-height:48px;padding:13px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 16px system-ui,sans-serif;text-align:center;text-decoration:none;margin-bottom:10px;cursor:pointer}
.primary{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.danger{color:var(--red);border-color:var(--red)}
.status{color:var(--red);font-weight:700;margin-bottom:12px}
svg{display:block;width:100%;height:auto;background:#101310;border-radius:12px}
small{color:var(--muted)}
ul{margin:0;padding-left:20px;color:var(--muted)}
</style>
</head>
<body><main><div class="brand">Dey Alert</div>{% block body %}{% endblock %}</main></body>
</html>
